<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色扮演质检工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========================================
   Design Tokens — Dark Medical Theme
   ======================================== */
:root {
  /* Background layers */
  --bg-overlay:      rgba(4, 18, 34, 0.82);
  --bg-card:         rgba(8, 28, 50, 0.90);
  --bg-card-hover:   rgba(14, 38, 66, 0.94);
  --bg-input:        rgba(255,255,255,0.06);
  --bg-input-hover:  rgba(255,255,255,0.10);

  /* Text */
  --ink:             #ffffff;
  --ink-bright:      #e0ecf8;
  --ink-muted:       #9ab0c4;
  --ink-faint:       #6a8098;
  --ink-dim:         #4a6078;

  /* Borders */
  --rule:            rgba(255,255,255,0.10);
  --rule-strong:     rgba(255,255,255,0.18);

  /* Section colors — brightened for dark bg */
  --c-highlight:     #34d399;
  --c-highlight-bg:  rgba(52, 211, 153, 0.12);
  --c-highlight-bd:  rgba(52, 211, 153, 0.28);
  --c-optimize:      #fb923c;
  --c-optimize-bg:   rgba(251, 146, 60, 0.12);
  --c-optimize-bd:   rgba(251, 146, 60, 0.28);
  --c-recommend:     #818cf8;
  --c-recommend-bg:  rgba(129, 140, 248, 0.12);
  --c-recommend-bd:  rgba(129, 140, 248, 0.28);

  /* Dimension colors */
  --c-dim1:          #34d399;
  --c-dim1-bg:       rgba(52, 211, 153, 0.12);
  --c-dim2:          #fb923c;
  --c-dim2-bg:       rgba(251, 146, 60, 0.12);
  --c-dim3:          #818cf8;
  --c-dim3-bg:       rgba(129, 140, 248, 0.12);

  /* Task nav */
  --c-task-active:   #34d399;
  --c-task-active-bg:rgba(52, 211, 153, 0.18);
  --c-task-inactive: #4a6078;
  --c-task-inactive-bg: rgba(255,255,255,0.05);

  /* Fonts */
  --font-display:  'Lora', 'Noto Serif SC', Georgia, serif;
  --font-body:     'Plus Jakarta Sans', 'Noto Sans SC', system-ui, sans-serif;

  /* Radius & Shadow */
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px;
  --shadow-sm:   0 2px 6px rgba(0,0,0,.25);
  --shadow-card: 0 4px 16px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.2);
  --shadow-lift: 0 8px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.25);
  --t-fast: 180ms cubic-bezier(.4,0,.2,1);
  --t-normal: 350ms cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 18px; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, #3c434c 0%, #2c3138 100%);
  min-height: 100vh;
}

/* ========================================
   Page Container
   ======================================== */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  transform: translateY(14px);
  transition: all var(--t-normal);
  pointer-events: none;
  position: absolute;
  top: 0; left: 0; right: 0;
}

.page--active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: all;
  position: relative;
}

.page--report {
  justify-content: flex-start;
  padding: 0;
}

/* ========================================
   Dashboard Page
   ======================================== */
.dashboard {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 640px;
  width: 100%;
}

/* — Task Navigation Bar — */
.task-nav {
  display: flex;
  gap: .5rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  justify-content: center;
}

.task-nav__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .25rem;
  padding: .625rem .875rem;
  border-radius: var(--r-md);
  background: var(--c-task-inactive-bg);
  border: 1px solid var(--rule);
  color: var(--c-task-inactive);
  font-size: .8125rem;
  font-weight: 600;
  cursor: default;
  transition: all var(--t-fast);
  min-width: 90px;
}

.task-nav__item--active {
  background: var(--c-task-active-bg);
  border-color: rgba(52,211,153,0.35);
  color: var(--c-task-active);
  box-shadow: 0 0 16px rgba(52,211,153,0.12);
}

.task-nav__item--active .task-nav__num {
  background: var(--c-task-active);
  color: #042218;
}

.task-nav__num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--c-task-inactive);
  color: #0a1a2e;
  font-size: .6875rem;
  font-weight: 800;
}

.task-nav__name {
  font-size: .75rem;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.3;
}

.task-nav__en {
  font-size: .5625rem;
  font-weight: 400;
  color: inherit;
  opacity: .75;
  white-space: nowrap;
  line-height: 1.3;
  font-style: italic;
  font-family: var(--font-display);
}

.task-nav__badge {
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 100px;
  background: rgba(52,211,153,0.2);
  color: #34d399;
}

/* — Dashboard header — */
.dashboard__badge {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  font-size: .8125rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--c-highlight);
  margin-bottom: 1.25rem;
}

.dashboard__badge::before,
.dashboard__badge::after {
  content: '';
  width: 24px;
  height: 2px;
  background: var(--c-highlight);
  opacity: .5;
  border-radius: 2px;
}

.dashboard__title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4.5vw, 2.875rem);
  font-weight: 600;
  letter-spacing: -.02em;
  color: var(--ink);
  margin-bottom: .875rem;
  line-height: 1.2;
  text-shadow: 0 2px 12px rgba(0,0,0,.3);
}

.dashboard__title em {
  font-style: italic;
  color: var(--c-highlight);
}

.dashboard__subtitle {
  font-size: 1.375rem;
  color: var(--ink-muted);
  max-width: 520px;
  line-height: 1.5;
  margin-bottom: 2.5rem;
}

/* — Selector card — */
.selector-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  padding: 2rem;
  width: 100%;
  text-align: left;
  backdrop-filter: blur(12px);
}

.selector-card__label {
  font-size: .8125rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 1rem;
}

.selector-row {
  display: flex;
  gap: .875rem;
  align-items: stretch;
}

/* — Custom Dropdown — */
.dropdown {
  flex: 1;
  position: relative;
}

.dropdown__trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: .875rem 1.125rem;
  background: var(--bg-input);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all var(--t-fast);
  gap: .875rem;
}

.dropdown__trigger:hover {
  background: var(--bg-input-hover);
  border-color: var(--rule-strong);
}

.dropdown--open .dropdown__trigger {
  border-color: var(--ink-muted);
  box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
}

.dropdown__trigger-placeholder {
  color: var(--ink-faint);
  font-weight: 400;
}

.dropdown__trigger-arrow {
  width: 20px;
  height: 20px;
  color: var(--ink-faint);
  transition: transform var(--t-fast);
}

.dropdown--open .dropdown__trigger-arrow {
  transform: rotate(180deg);
}

.dropdown__menu {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  right: 0;
  background: var(--bg-card-hover);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lift);
  z-index: 20;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all var(--t-fast);
}

.dropdown--open .dropdown__menu {
  max-height: 340px;
  opacity: 1;
}

.dropdown__option {
  display: flex;
  align-items: center;
  gap: .875rem;
  padding: .875rem 1.125rem;
  cursor: pointer;
  transition: all var(--t-fast);
  font-size: 1rem;
  font-weight: 500;
  color: var(--ink-bright);
}

.dropdown__option:hover {
  background: var(--bg-input-hover);
}

.dropdown__option:first-child { border-radius: var(--r-md) var(--r-md) 0 0; }
.dropdown__option:last-child  { border-radius: 0 0 var(--r-md) var(--r-md); }

.dropdown__option:not(:last-child) {
  border-bottom: 1px solid var(--rule);
}

.dropdown__option-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dropdown__option:nth-child(1) .dropdown__option-dot { background: var(--c-highlight); }
.dropdown__option:nth-child(2) .dropdown__option-dot { background: var(--c-optimize); }
.dropdown__option:nth-child(3) .dropdown__option-dot { background: var(--c-recommend); }
.dropdown__option:nth-child(4) .dropdown__option-dot { background: #fbbf24; }
.dropdown__option:nth-child(5) .dropdown__option-dot { background: #38bdf8; }

/* — View button — */
.btn-view {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .875rem 1.75rem;
  background: var(--ink);
  color: #0a1628;
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--t-fast);
  white-space: nowrap;
  min-width: 110px;
}

.btn-view:hover:not(:disabled) {
  background: var(--ink-bright);
  transform: translateY(-1px);
  box-shadow: var(--shadow-lift);
}

.btn-view:disabled {
  opacity: .38;
  cursor: not-allowed;
}

.btn-view svg {
  width: 18px;
  height: 18px;
}

/* — Footer hints — */
.dashboard__hints {
  display: flex;
  gap: 2rem;
  margin-top: 1.75rem;
  font-size: .8125rem;
  color: var(--ink-faint);
}

.dashboard__hint {
  display: flex;
  align-items: center;
  gap: .5rem;
}

.dashboard__hint kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 5px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--ink-muted);
  font-family: var(--font-body);
}

/* ========================================
   Stage Ready — 开始质检按钮
   ======================================== */
.stage-ready {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* — 已发布状态按钮（灰色不可点，表示教师已发布任务） — */
.btn-published {
  display: inline-flex;
  align-items: center;
  gap: .875rem;
  padding: 1.125rem 2.75rem;
  background: #334155;
  color: #c3cede;
  border: 1px solid #475569;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: .02em;
  cursor: default;
  box-shadow: var(--shadow-card);
  user-select: none;
}

.btn-published svg { width: 24px; height: 24px; color: #94a3b8; }

.btn-published__en {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  color: #8ea6bf;
  letter-spacing: .04em;
  margin-top: 2px;
}

/* — 绿色主按钮：选择小组查看报告 — */
.btn-start {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  margin-top: 1.5rem;
  padding: 1.1rem 2.75rem;
  background: linear-gradient(135deg, #34d399 0%, #0f9e77 100%);
  color: #042218;
  border: none;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(52,211,153,.35), var(--shadow-card);
  transition: all var(--t-fast);
}

.btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 36px rgba(52,211,153,.45), var(--shadow-lift);
}

.btn-start:active { transform: translateY(0); }

.btn-start svg { width: 24px; height: 24px; }

.stage-ready__hint {
  margin-top: 1.25rem;
  font-size: .875rem;
  color: var(--ink-faint);
  max-width: 480px;
  line-height: 1.7;
}

/* ========================================
   Select Stage — 小组选择页
   ======================================== */
.select-stage { width: 100%; text-align: left; }

.select-stage__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.select-stage__title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: .5rem;
}

.select-stage__title svg { width: 18px; height: 18px; color: var(--c-highlight); }

.select-stage__footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  margin-top: 1.75rem;
  flex-wrap: wrap;
}

.select-stage__hint {
  font-size: .875rem;
  color: var(--ink-faint);
}

.select-stage__hint strong { color: var(--c-highlight); }

.btn-reset {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  padding: .5rem 1rem;
  border-radius: 100px;
  font-size: .8125rem;
  font-weight: 600;
  color: var(--ink-faint);
  background: var(--bg-input);
  border: 1px solid var(--rule);
  cursor: pointer;
  font-family: var(--font-body);
  transition: all var(--t-fast);
  white-space: nowrap;
}

.btn-reset:hover { color: var(--ink); border-color: var(--rule-strong); background: var(--bg-input-hover); }

/* — 小组卡片网格 — */
.group-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .875rem;
  margin-bottom: 1.25rem;
}

.group-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .5rem;
  padding: 1.125rem .75rem;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: all var(--t-fast);
  box-shadow: var(--shadow-sm);
}

.group-card:hover {
  border-color: var(--rule-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}

.group-card--selected {
  border-color: rgba(52,211,153,.6);
  box-shadow: 0 0 0 3px rgba(52,211,153,.15);
}

.group-card--submitted {
  border-color: rgba(52,211,153,.4);
  background: var(--c-highlight-bg);
}

.group-card__name { font-size: 1rem; font-weight: 700; color: var(--ink); }

.group-card__status {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  font-size: .75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 100px;
  background: var(--bg-input);
  color: var(--ink-faint);
}

.group-card--submitted .group-card__status {
  background: var(--c-highlight-bg);
  color: var(--c-highlight);
}

.group-card__status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.group-card__hint { font-size: .6875rem; color: var(--ink-dim); }

/* — 文案提交卡片 — */
.submit-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  padding: 1.5rem;
  backdrop-filter: blur(12px);
}

.submit-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.submit-card__group { font-size: 1.125rem; font-weight: 700; color: var(--ink); }

.submit-card__badge {
  font-size: .75rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 100px;
  background: var(--bg-input);
  color: var(--ink-faint);
  transition: all var(--t-fast);
}

.submit-card__badge--done {
  background: var(--c-highlight-bg);
  color: var(--c-highlight);
}

.submit-card__textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 1rem 1.125rem;
  background: var(--bg-input);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  color: var(--ink-bright);
  font-family: var(--font-body);
  font-size: .9375rem;
  line-height: 1.6;
  transition: all var(--t-fast);
}

.submit-card__textarea:focus {
  outline: none;
  border-color: var(--c-highlight);
  box-shadow: 0 0 0 3px rgba(52,211,153,.15);
}

.submit-card__textarea::placeholder { color: var(--ink-dim); }

.submit-card__actions {
  display: flex;
  gap: .875rem;
  margin-top: 1rem;
  align-items: center;
  flex-wrap: wrap;
}

.btn-submit {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .875rem 1.75rem;
  background: var(--ink);
  color: #0a1628;
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--t-fast);
  white-space: nowrap;
}

.btn-submit:hover:not(:disabled) {
  background: var(--ink-bright);
  transform: translateY(-1px);
  box-shadow: var(--shadow-lift);
}

.btn-submit:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

.submit-card__done-hint {
  font-size: .875rem;
  color: var(--c-highlight);
  font-weight: 700;
}

@media (max-width: 768px) {
  .group-grid { grid-template-columns: repeat(2, 1fr); }
  .btn-start { padding: 1rem 2rem; font-size: 1.125rem; }
  .select-stage__bar { flex-wrap: wrap; }
}

/* ========================================
   Report Page
   ======================================== */
.report-page {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 2rem 2.5rem 3.5rem;
}

/* — Top Bar — */
.report-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.125rem 2.5rem;
  background: var(--bg-card);
  border-bottom: 1px solid var(--rule);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(16px);
}

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .625rem 1rem;
  border-radius: 100px;
  font-size: .875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast);
  border: 1px solid var(--rule);
  background: var(--bg-input);
  color: var(--ink-muted);
  font-family: var(--font-body);
}

.btn-back:hover {
  border-color: var(--ink-faint);
  color: var(--ink);
  background: var(--bg-input-hover);
}

.btn-back svg {
  width: 16px;
  height: 16px;
}

.report-topbar__group {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
}

.report-topbar__scenario {
  font-size: .8125rem;
  color: var(--ink-faint);
}

/* — Report Title — */
.report-title {
  margin-top: 2.5rem;
  margin-bottom: 2rem;
}

.report-title__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  font-size: .8125rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--c-highlight);
  margin-bottom: .625rem;
}

.report-title__eyebrow::before {
  content: '';
  width: 28px;
  height: 2.5px;
  background: var(--c-highlight);
  border-radius: 2px;
}

.report-title__heading {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 3.2vw, 2.375rem);
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);

.dim-grid {

  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
  margin-bottom: 3rem;
}

.dim-card {
  background: var(--bg-card);

  border-radius: var(--r-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  transition: all var(--t-fast);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
}

.dim-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}

.dim-card--dim1::before { background: var(--c-dim1); }
.dim-card--dim2::before { background: var(--c-dim2); }
.dim-card--dim3::before { background: var(--c-dim3); }

.dim-card:hover {
  box-shadow: var(--shadow-card);
  transform: translateY(-2px);
  border-color: var(--rule-strong);
}

.dim-card__num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  font-size: .8125rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 1rem;
}

.dim-card--dim1 .dim-card__num { background: var(--c-dim1); }
.dim-card--dim2 .dim-card__num { background: var(--c-dim2); }
.dim-card--dim3 .dim-card__num { background: var(--c-dim3); }

.dim-card__name {
  font-size: .9375rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 1rem;
  line-height: 1.45;
}

/* — Dot meter — */
.dim-meter {
  display: flex;
  gap: 8px;
  margin-bottom: .625rem;
}

.dim-meter__dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  transition: all var(--t-fast);
}

.dim-meter__dot--filled { background: currentColor; }

.dim-card--dim1 .dim-meter__dot--filled { color: var(--c-dim1); }
.dim-card--dim2 .dim-meter__dot--filled { color: var(--c-dim2); }
.dim-card--dim3 .dim-meter__dot--filled { color: var(--c-dim3); }

.dim-card__label {
  font-size: .8125rem;
  font-weight: 600;
  margin-bottom: .75rem;
}

.dim-card__label--strong { color: var(--c-dim1); }
.dim-card__label--medium { color: var(--c-dim2); }
.dim-card__label--weak   { color: #f87171; }

.dim-card__notes {
  font-size: .8125rem;
  color: var(--ink-muted);
  line-height: 1.65;
  display: flex;
  flex-direction: column;
  gap: .375rem;
}

.dim-card__note::before {
  content: '· ';
  font-weight: 700;
}

/* ========================================
   Report Sections
   ======================================== */
.section {
  margin-bottom: 2.5rem;
}

.section__header {
  display: flex;
  align-items: center;
  gap: .875rem;
  margin-bottom: 1.25rem;
}

.section__badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-md);
  font-family: var(--font-display);

  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.section--highlight .section__badge { background: var(--c-highlight); }
.section--optimize .section__badge { background: var(--c-optimize); }
.section--recommend .section__badge { background: var(--c-recommend); }

.section__title {

.highlight-card {

.recommend-card__text {

// ========================================
// State
// ========================================
const TOTAL_GROUPS = 5;
let sessionStarted = false;
let selectedGroup = null;
let activeTask = 3;

// 切换顶部任务卡高亮（默认 Task 3 为本次课）
function setActiveTask(n) {
  activeTask = n;
  const items = document.querySelectorAll('#taskNav .task-nav__item');
  items.forEach(it => it.classList.remove('task-nav__item--active'));
  const target = document.querySelector('#taskNav .task-nav__item:nth-child(' + n + ')');
  if (target) target.classList.add('task-nav__item--active');
}

// ========================================
// 进入小组选择页 / 返回就绪页
// ========================================
function startSession() {
  sessionStarted = true;
  document.getElementById('stageReady').style.display = 'none';
  document.getElementById('stageSelect').style.display = 'block';
  renderGroupGrid();
  selectGroup(1);
}

function backToReady() {
  sessionStarted = false;
  selectedGroup = null;
  document.getElementById('stageSelect').style.display = 'none';
  document.getElementById('stageReady').style.display = 'flex';
  document.getElementById('btnViewReport').disabled = true;
  document.getElementById('selectHint').textContent = '请先选择一个小组';
}

// ========================================
// 小组卡片
// ========================================
function renderGroupGrid() {
  const grid = document.getElementById('groupGrid');
  let html = '';
  for (let i = 1; i <= TOTAL_GROUPS; i++) {
    const sel = selectedGroup === i;
    html += `
      <div class="group-card${sel ? ' group-card--selected' : ''}" onclick="selectGroup(${i})">
        <div class="group-card__name">Group ${i}</div>
        <span class="group-card__status"><span class="group-card__status-dot"></span>${sel ? '已选' : '选择'}</span>
        <span class="group-card__hint">${sel ? '已选中该组' : '点击选中'}</span>
      </div>`;
  }
  grid.innerHTML = html;
}

function selectGroup(n) {
  selectedGroup = n;
  renderGroupGrid();
  document.getElementById('btnViewReport').disabled = false;
  document.getElementById('selectHint').innerHTML = '已选择 <strong>Group ' + n + '</strong>，点击「查看报告」打开该组质检结果';
}

// ========================================
// 轻提示 Toast
// ========================================
function showWorkToast(msg) {
  let t = document.getElementById('workToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'workToast';
    t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(8,28,50,.96);border:1px solid rgba(52,211,153,.45);color:#e0ecf8;padding:12px 26px;border-radius:12px;font-size:.9375rem;font-weight:600;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.45);transition:opacity .3s;opacity:1;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

// ========================================
// View Switching
// ========================================
function openReport() {
  if (!selectedGroup) {
    showWorkToast('请先选择一个小组');
    return;
  }

  renderReport(selectedGroup);

  const dashPage = document.getElementById('pageDashboard');
  const reportPage = document.getElementById('pageReport');

  dashPage.classList.remove('page--active');
  dashPage.style.display = 'none';

  reportPage.style.display = 'flex';
  requestAnimationFrame(() => {
    reportPage.classList.add('page--active');
    window.scrollTo(0, 0);
  });
}

function backToDashboard() {
  const dashPage = document.getElementById('pageDashboard');
  const reportPage = document.getElementById('pageReport');

  reportPage.classList.remove('page--active');

  setTimeout(() => {
    reportPage.style.display = 'none';
    dashPage.style.display = 'flex';
    requestAnimationFrame(() => {
      dashPage.classList.add('page--active');
    });
  }, 350);
}

// 返回工作台：回到首页（任务卡 + 选择小组查看报告）
function returnToWorkbench() {
  document.getElementById('stageSelect').style.display = 'none';
  document.getElementById('stageReady').style.display = 'flex';
  backToDashboard();
}

// ========================================
// Render Report
// ========================================
function renderReport(n) {
  const data = groupReports[n];

  // Update top bar
  document.getElementById('reportGroupLabel').textContent = 'Group ' + n;
  document.getElementById('reportScenarioLabel').textContent = '场景：' + data.scenario;

  // Build dimension cards
  let dimsHTML = '<div class="dim-grid">';
  data.dimensions.forEach(dim => {
    let dotsHTML = '';
    for (let i = 0; i < 3; i++) {
      dotsHTML += `<span class="dim-meter__dot${i < dim.filled ? ' dim-meter__dot--filled' : ''}"></span>`;
    }
    let notesHTML = dim.notes.map(n => `<span class="dim-card__note">${n}</span>`).join('');

    dimsHTML += `
      <div class="dim-card dim-card--${dim.cssClass}">
        <div class="dim-card__num">0${dim.num}</div>
        <div class="dim-card__name">${dim.name}<br>${dim.description}</div>
        <div class="dim-meter">${dotsHTML}</div>
        <div class="dim-card__label dim-card__label--${dim.labelClass}">${dim.labelText}</div>
        <div class="dim-card__notes">${notesHTML}</div>
      </div>`;
  });
  dimsHTML += '</div>';

  // Build highlights
  let highlightsHTML = '';
  data.highlights.forEach((h, i) => {
    highlightsHTML += `
      <div class="highlight-card">
        <div class="highlight-card__icon">${i + 1}</div>
        <div>
          <div class="highlight-card__label">${h.label}</div>
          ${h.quote ? `<p class="highlight-card__quote">${h.quote}</p>` : ''}
          <p class="highlight-card__note">${h.note}</p>
        </div>
      </div>`;
  });

  // Build optimizations
  let optsHTML = '';
  data.optimizations.forEach((o, i) => {
    optsHTML += `
      <div class="optimize-card">
        <div class="optimize-card__num">${String(i + 1).padStart(2, '0')}</div>
        <div>
          ${o.quote ? `<p class="optimize-card__quote">${o.quote}</p>` : ''}
          <p class="optimize-card__note">${o.note}</p>
        </div>
      </div>`;
  });

  // Build recommendations
  let recsHTML = '';
  data.recommendations.forEach((r, i) => {
    if (r.before) {
      recsHTML += `
        <div class="recommend-card">
          <div class="recommend-card__inner">
            <div class="recommend-card__before">
              <div class="recommend-card__label">● 待优化原句</div>
              <p class="recommend-card__text">${r.before}</p>
            </div>
            <div class="recommend-card__arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </div>
            <div class="recommend-card__after">
              <div class="recommend-card__label">◆ 优化参考</div>
              <p class="recommend-card__text">${r.after}</p>
            </div>
          </div>
        </div>`;
    } else {
      recsHTML += `
        <div class="recommend-card" style="padding: 1rem 1.25rem; border-left: 3px solid var(--c-recommend);">
          <div class="recommend-card__label" style="color:var(--c-recommend)">◆ 优化参考</div>
          <p class="recommend-card__text">${r.note}</p>
        </div>`;
    }
  });

  // Assemble
  document.getElementById('reportContent').innerHTML = `
    <div class="report-title">
      <div class="report-title__eyebrow">AI 质检参考报告 · Classroom QA Reference</div>
      <h1 class="report-title__heading">Group ${n} · ${data.scenario}</h1>
    </div>

    ${dimsHTML}

    <section class="section section--highlight">
      <div class="section__header">
        <div class="section__badge">一</div>
        <h2 class="section__title">Performance Highlights<span class="section__title-sub">表演亮点</span></h2>
      </div>
      <div class="highlight-list">${highlightsHTML}</div>
    </section>

    <section class="section section--optimize">
      <div class="section__header">
        <div class="section__badge">二</div>
        <h2 class="section__title">Sentences to be Optimized<span class="section__title-sub">待优化原句</span></h2>
      </div>
      <div class="optimize-list">${optsHTML}</div>
    </section>

    <section class="section section--recommend">
      <div class="section__header">
        <div class="section__badge">三</div>
        <h2 class="section__title">Recommended Expressions<span class="section__title-sub">岗位优化参考句式</span></h2>
      </div>
      <div class="recommend-list">${recsHTML}</div>
    </section>

    <div class="report-footer">
      <span><strong>说明：</strong>本报告为AI 辅助生成，仅作为课堂辅助参考，不设分数或等级评判。</span>
      <span style="color:var(--ink-faint)">AI 辅助生成 · 仅供教学使用</span>
    </div>
  `;

  // Scroll to top
  window.scrollTo(0, 0);
}

// ========================================
// Keyboard Shortcuts
// ========================================
document.addEventListener('keydown', function(e) {
  // 隐藏式小组切换：仅在报告页内用 ↑↓ 切换 Group
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const rp = document.getElementById('pageReport');
    if (rp.style.display === 'none') return;
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    let next = selectedGroup ? selectedGroup + dir : 1;
    if (next < 1) next = TOTAL_GROUPS;
    if (next > TOTAL_GROUPS) next = 1;
    selectedGroup = next;
    renderReport(next);
    showWorkToast('Group ' + next);
    return;
  }
  if (e.key === 'Escape') {
    returnToWorkbench();
    return;
  }
});

// 联动：从录音工作台经 ?group=N 自动打开对应小组报告（无参数时保持原流程不变）
(function initFromUrl() {
  const p = new URLSearchParams(location.search);
  const g = parseInt(p.get('group'), 10);
  if (g >= 1 && g <= TOTAL_GROUPS && groupReports[g]) {
    selectedGroup = g;
    renderReport(g);
    const dash = document.getElementById('pageDashboard');
    const rp = document.getElementById('pageReport');
    dash.classList.remove('page--active');
    dash.style.display = 'none';
    rp.style.display = 'flex';
    requestAnimationFrame(() => {
      rp.classList.add('page--active');
      window.scrollTo(0, 0);
    });
  }
})();
