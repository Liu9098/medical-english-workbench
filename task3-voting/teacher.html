<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学情统计大屏 — 角色扮演评价表</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --c-teal:#0d9488; --c-teal-d:#0f766e; --c-sky:#0ea5e9;
    --c-text:#1e293b; --c-muted:#64748b; --c-border:#e2e8f0;
    --c-bg:#f1f5f9; --c-card:#ffffff; --c-track:#e2e8f0;
    --c-yes:#10b981; --c-no:#94a3b8;
  }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--c-bg); color:var(--c-text);
    min-height:100vh; padding:16px;
  }
  .container { max-width:1280px; margin:0 auto; }

  /* ===== 顶部头 ===== */
  .top-bar {
    background:linear-gradient(135deg,var(--c-teal),var(--c-sky));
    border-radius:16px; padding:28px 32px; color:#fff; margin-bottom:16px;
    box-shadow:0 8px 24px rgba(13,148,136,.2);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  }
  .top-bar .title h1 { font-size:24px; font-weight:700; margin-bottom:4px; }
  .top-bar .title .sub { font-size:14px; opacity:.85; }
  .top-bar .meta { display:flex; align-items:center; gap:24px; }
  .top-bar .meta-item { text-align:center; }
  .top-bar .meta-item .val { font-size:36px; font-weight:800; line-height:1; }
  .top-bar .meta-item .lab { font-size:13px; opacity:.8; margin-top:4px; }

  /* ===== 信息条 ===== */
  .info-bar {
    background:var(--c-card); border-radius:14px; padding:20px 28px; margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  }
  .qr-box { text-align:center; flex-shrink:0; }
  .qr-box img {
    width:140px; height:140px; border-radius:10px; border:3px solid var(--c-border);
  }
  .qr-box .qr-label { font-size:12px; color:var(--c-muted); margin-top:6px; }
  .info-details { flex:1; min-width:300px; }
  .info-details .url-row {
    display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .info-details .url-row .url-text-prefix { font-size:14px; color:var(--c-muted); }
  .info-details .url-row .url-text {
    font-size:18px; font-weight:700; color:var(--c-teal-d); font-family:monospace; word-break:break-all;
  }
  .progress-row { display:flex; align-items:center; gap:14px; }
  .progress-bar {
    flex:1; height:30px; background:var(--c-track); border-radius:15px; overflow:hidden;
    position:relative;
  }
  .progress-bar .fill {
    height:100%; background:linear-gradient(90deg,var(--c-teal),var(--c-sky));
    border-radius:15px; transition:width .6s ease; width:0%;
    display:flex; align-items:center; justify-content:flex-end; padding-right:12px;
    color:#fff; font-size:14px; font-weight:700; min-width:40px;
  }
  .progress-text { font-size:18px; font-weight:700; white-space:nowrap; }
  .progress-text .big { font-size:28px; color:var(--c-teal); }
  .btn-group { display:flex; gap:10px; flex-shrink:0; flex-direction:column; }
  .demo-btn {
    padding:10px 20px; border-radius:10px; border:2px solid #fbbf24; background:#fffbeb;
    color:#b45309; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s;
    white-space:nowrap;
  }
  .demo-btn:hover { background:#fef3c7; }
  .demo-btn:active { transform:scale(.95); }
  .reset-btn {
    padding:10px 20px; border-radius:10px; border:2px solid #fca5a5; background:#fff;
    color:#dc2626; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s;
    white-space:nowrap;
  }
  .reset-btn:hover { background:#fef2f2; }
  .reset-btn:active { transform:scale(.95); }

  /* ===== 全部完成提示 ===== */
  .all-done {
    background:linear-gradient(135deg,#10b981,#059669); color:#fff; border-radius:12px;
    padding:12px 24px; font-size:16px; font-weight:700; text-align:center; margin-bottom:16px;
    display:none; animation:slideDown .4s ease;
    box-shadow:0 4px 14px rgba(16,185,129,.25);
  }
  .all-done.show { display:block; }
  @keyframes slideDown { from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

  /* ===== 演示模式标记 ===== */
  .demo-badge {
    display:none; background:#fef3c7; color:#b45309; border:2px solid #fbbf24;
    border-radius:10px; padding:8px 16px; font-size:13px; font-weight:600;
    text-align:center; margin-bottom:16px;
  }
  .demo-badge.show { display:block; }

  /* ===== 统计卡片网格 ===== */
  .stats-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px;
  }
  .stat-card {
    background:var(--c-card); border-radius:14px; padding:24px 28px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-top:4px solid var(--c-teal);
  }
  .stat-card .stat-head { margin-bottom:16px; }
  .stat-card .stat-num {
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; background:var(--c-teal); color:#fff;
    font-size:14px; font-weight:700; margin-right:8px; vertical-align:middle;
  }
  .stat-card .stat-label { font-size:17px; font-weight:700; vertical-align:middle; }
  .stat-card .stat-en { font-size:12px; color:var(--c-muted); margin-top:4px; margin-left:38px; }

  /* count 类型 */
  .stat-card .count-display {
    display:flex; align-items:baseline; gap:6px; margin-bottom:14px;
  }
  .stat-card .count-display .num {
    font-size:48px; font-weight:800; color:var(--c-teal); line-height:1;
  }
  .stat-card .count-display .unit { font-size:18px; color:var(--c-muted); }
  .stat-card .count-display .label { font-size:15px; color:var(--c-text); margin-left:8px; }
  .stat-card .bar-track {
    height:24px; background:var(--c-track); border-radius:12px; overflow:hidden;
    display:flex;
  }
  .stat-card .bar-yes { height:100%; background:var(--c-yes); border-radius:12px 0 0 12px; transition:width .6s ease; }
  .stat-card .bar-no { height:100%; background:var(--c-no); border-radius:0 12px 12px 0; transition:width .6s ease; }
  .stat-card .bar-labels { display:flex; justify-content:space-between; margin-top:6px; font-size:13px; color:var(--c-muted); }

  /* yesno 类型 */
  .stat-card .yn-display {
    display:flex; align-items:center; gap:20px; margin-bottom:14px;
  }
  .stat-card .yn-item { text-align:center; }
  .stat-card .yn-item .yn-num { font-size:48px; font-weight:800; line-height:1; }
  .stat-card .yn-item .yn-lab { font-size:14px; color:var(--c-muted); margin-top:4px; }
  .stat-card .yn-item.yes .yn-num { color:var(--c-yes); }
  .stat-card .yn-item.no .yn-num { color:var(--c-no); }
  .stat-card .yn-divider { width:1px; height:60px; background:var(--c-border); }

  /* 数字变化动画 */
  .num-change { animation:numFlash .5s ease; }
  @keyframes numFlash { 0%{transform:scale(1.2); color:#0ea5e9;} 100%{transform:scale(1);} }

  /* 响应式 */
  @media (max-width:768px) {
    .stats-grid { grid-template-columns:1fr; }
    .top-bar { flex-direction:column; text-align:center; }
    .info-bar { flex-direction:column; align-items:center; }
    .stat-card .count-display .num, .stat-card .yn-item .yn-num { font-size:36px; }
    .btn-group { flex-direction:row; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 顶部头 -->
  <div class="top-bar">
    <div class="title">
      <h1>Task 3 体检报告转述・角色扮演评价表</h1>
      <div class="sub">学情统计大屏 / Class Learning Analytics Dashboard</div>
    </div>
    <div class="meta">
      <div class="meta-item">
        <div class="val" id="metaTotal">24</div>
        <div class="lab">总参与学生</div>
      </div>
      <div class="meta-item">
        <div class="val" id="metaSubmitted">0</div>
        <div class="lab">已提交</div>
      </div>
    </div>
  </div>

  <!-- 信息条 -->
  <div class="info-bar">
    <div class="qr-box">
      <img id="qrCode" src="" alt="二维码" onerror="this.style.display='none'">
      <div class="qr-label">扫码填写评价表</div>
    </div>
    <div class="info-details">
      <div class="url-row">
        <span class="url-text-prefix">学生访问网址：</span>
        <span class="url-text" id="urlText">加载中…</span>
      </div>
      <div class="progress-row">
        <div class="progress-bar"><div class="fill" id="progressFill">0</div></div>
        <div class="progress-text"><span class="big" id="progressNum">0</span> / 24</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="demo-btn" onclick="applyDemo()">⚡ 加载模拟数据</button>
      <button class="reset-btn" onclick="resetAll()">重置全部数据</button>
    </div>
  </div>

  <!-- 演示模式标记 -->
  <div class="demo-badge" id="demoBadge">
    ⚡ 当前为模拟学情数据（教学比赛录课演示用）
  </div>

  <!-- 全部完成提示 -->
  <div class="all-done" id="allDone">
    全班 24 人已全部提交！可以展示统计结果。
  </div>

  <!-- 统计卡片 -->
  <div class="stats-grid" id="statsGrid"></div>

</div>

<script>
var TOTAL = 24;
var lastData = null;

/* 预设模拟学情（与教师端学情诊断口径一致）：
   ① 适度区间化 19/24 · ② 健康指标讲解 Yes 16 · ③ 共情句式 20/24
   ④ 主动问询 15/24 · ⑤ 太极拳 Yes 18 · ⑥ 自然文化 Yes 17 */
var DEMO = {
  q1:{type:'count',identified:19,notIdentified:5},
  q2:{type:'yesno',yes:16,no:8},
  q3:{type:'count',identified:20,notIdentified:4},
  q4:{type:'count',identified:15,notIdentified:9},
  q5:{type:'yesno',yes:18,no:6},
  q6:{type:'yesno',yes:17,no:7},
};

/* ===== 初始化卡片框架（6 项，对齐教师端） ===== */
function initCards() {
  var grid = document.getElementById('statsGrid');
  var items = [
    {id:'q1',num:1,label:'适度、区间化表述',en:'Mild/range-based descriptions',type:'count'},
    {id:'q2',num:2,label:'健康指标清晰讲解',en:'Clear explanation of health indicators',type:'yesno'},
    {id:'q3',num:3,label:'共情句式运用',en:'Empathy sentence patterns',type:'count'},
    {id:'q4',num:4,label:'主动问询沟通',en:'Active inquiries',type:'count'},
    {id:'q5',num:5,label:'太极拳恰当介绍',en:'Tai Chi introduced appropriately',type:'yesno'},
    {id:'q6',num:6,label:'自然的文化表达',en:'Natural cultural expression',type:'yesno'},
  ];

  var html = '';
  items.forEach(function(it) {
    if (it.type === 'count') {
      html += '<div class="stat-card" id="card-' + it.id + '">' +
        '<div class="stat-head">' +
          '<span class="stat-num">' + it.num + '</span>' +
          '<span class="stat-label">' + it.label + '</span>' +
          '<div class="stat-en">' + it.en + '</div>' +
        '</div>' +
        '<div class="count-display">' +
          '<span class="num" id="' + it.id + '-identified">0</span>' +
          '<span class="unit">人</span>' +
          '<span class="label">识别出</span>' +
        '</div>' +
        '<div class="bar-track">' +
          '<div class="bar-yes" id="' + it.id + '-bar-yes" style="width:0%"></div>' +
          '<div class="bar-no" id="' + it.id + '-bar-no" style="width:100%"></div>' +
        '</div>' +
        '<div class="bar-labels">' +
          '<span id="' + it.id + '-label-yes">识别 0%</span>' +
          '<span id="' + it.id + '-label-no">未识别 0%</span>' +
        '</div>' +
      '</div>';
    } else {
      html += '<div class="stat-card" id="card-' + it.id + '">' +
        '<div class="stat-head">' +
          '<span class="stat-num">' + it.num + '</span>' +
          '<span class="stat-label">' + it.label + '</span>' +
          '<div class="stat-en">' + it.en + '</div>' +
        '</div>' +
        '<div class="yn-display">' +
          '<div class="yn-item yes">' +
            '<div class="yn-num" id="' + it.id + '-yes">0</div>' +
            '<div class="yn-lab">Yes</div>' +
          '</div>' +
          '<div class="yn-divider"></div>' +
          '<div class="yn-item no">' +
            '<div class="yn-num" id="' + it.id + '-no">0</div>' +
            '<div class="yn-lab">No</div>' +
          '</div>' +
        '</div>' +
        '<div class="bar-track">' +
          '<div class="bar-yes" id="' + it.id + '-bar-yes" style="width:0%"></div>' +
          '<div class="bar-no" id="' + it.id + '-bar-no" style="width:100%"></div>' +
        '</div>' +
        '<div class="bar-labels">' +
          '<span id="' + it.id + '-label-yes">Yes 0%</span>' +
          '<span id="' + it.id + '-label-no">No 0%</span>' +
        '</div>' +
      '</div>';
    }
  });
  grid.innerHTML = html;
}

/* ===== 更新统计数据 ===== */
function updateStats(data) {
  var submitted = data.total;

  var metaEl = document.getElementById('metaSubmitted');
  if (lastData && lastData.total !== submitted) {
    metaEl.classList.remove('num-change');
    void metaEl.offsetWidth;
    metaEl.classList.add('num-change');
  }
  metaEl.textContent = submitted;

  var pct = TOTAL > 0 ? Math.round(submitted / TOTAL * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').textContent = pct > 10 ? pct + '%' : '';
  document.getElementById('progressNum').textContent = submitted;

  var allDone = document.getElementById('allDone');
  if (submitted >= TOTAL) { allDone.classList.add('show'); }
  else { allDone.classList.remove('show'); }

  data.items.forEach(function(item) {
    if (item.type === 'count') {
      var el = document.getElementById(item.id + '-identified');
      if (el) {
        el.textContent = item.identified;
        if (lastData && getOldVal(item.id, 'identified') !== item.identified) {
          el.classList.remove('num-change');
          void el.offsetWidth;
          el.classList.add('num-change');
        }
      }
      var barYes = document.getElementById(item.id + '-bar-yes');
      var barNo = document.getElementById(item.id + '-bar-no');
      var totalItems = item.identified + item.notIdentified;
      var yesPct = totalItems > 0 ? Math.round(item.identified / totalItems * 100) : 0;
      var noPct = totalItems > 0 ? 100 - yesPct : 100;
      if (barYes) barYes.style.width = yesPct + '%';
      if (barNo) barNo.style.width = noPct + '%';

      var labelYes = document.getElementById(item.id + '-label-yes');
      var labelNo = document.getElementById(item.id + '-label-no');
      if (labelYes) labelYes.textContent = '识别 ' + yesPct + '%';
      if (labelNo) labelNo.textContent = '未识别 ' + noPct + '%';

    } else {
      var yesEl = document.getElementById(item.id + '-yes');
      var noEl = document.getElementById(item.id + '-no');
      if (yesEl) {
        yesEl.textContent = item.yes;
        if (lastData && getOldVal(item.id, 'yes') !== item.yes) {
          yesEl.classList.remove('num-change');
          void yesEl.offsetWidth;
          yesEl.classList.add('num-change');
        }
      }
      if (noEl) {
        noEl.textContent = item.no;
        if (lastData && getOldVal(item.id, 'no') !== item.no) {
          noEl.classList.remove('num-change');
          void noEl.offsetWidth;
          noEl.classList.add('num-change');
        }
      }
      var ybar = document.getElementById(item.id + '-bar-yes');
      var nbar = document.getElementById(item.id + '-bar-no');
      var ynTotal = item.yes + item.no;
      var yPct = ynTotal > 0 ? Math.round(item.yes / ynTotal * 100) : 0;
      var nPct = ynTotal > 0 ? 100 - yPct : 100;
      if (ybar) ybar.style.width = yPct + '%';
      if (nbar) nbar.style.width = nPct + '%';

      var labelY = document.getElementById(item.id + '-label-yes');
      var labelN = document.getElementById(item.id + '-label-no');
      if (labelY) labelY.textContent = 'Yes ' + yPct + '%';
      if (labelN) labelN.textContent = 'No ' + nPct + '%';
    }
  });

  lastData = JSON.parse(JSON.stringify(data));
}

function getOldVal(id, key) {
  if (!lastData) return null;
  var item = lastData.items.find(function(it) { return it.id === id; });
  return item ? item[key] : null;
}

/* ===== 生成二维码（基于当前部署网址，无需后端） ===== */
function loadQR() {
  var base = location.href.substring(0, location.href.lastIndexOf('/') + 1);
  var url = base + 'index.html';
  document.getElementById('urlText').textContent = url;
  var qr = document.getElementById('qrCode');
  qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=' + encodeURIComponent(url);
}

/* ===== 加载模拟数据 ===== */
function applyDemo() {
  var items = [];
  ['q1','q2','q3','q4','q5','q6'].forEach(function(id) {
    var d = DEMO[id];
    if (d.type === 'count') items.push({id:id, type:'count', identified:d.identified, notIdentified:d.notIdentified});
    else items.push({id:id, type:'yesno', yes:d.yes, no:d.no});
  });
  updateStats({total: TOTAL, items: items});
  document.getElementById('demoBadge').classList.add('show');
}

/* ===== 重置全部数据 ===== */
function resetAll() {
  var items = [];
  ['q1','q2','q3','q4','q5','q6'].forEach(function(id) {
    var d = DEMO[id];
    if (d.type === 'count') items.push({id:id, type:'count', identified:0, notIdentified:0});
    else items.push({id:id, type:'yesno', yes:0, no:0});
  });
  updateStats({total: 0, items: items});
  document.getElementById('demoBadge').classList.remove('show');
}

/* ===== 初始化 ===== */
initCards();
loadQR();
applyDemo();   // 进入即展示模拟学情，便于课堂大屏直接呈现
</script>
</body>
</html>
